name: Publish

# Every push to main rebuilds the source, signs it and puts it on GitHub Pages. A pull request builds and checks it
# without the key, so someone else's change can be reviewed without being able to sign anything. With no key set yet,
# a push is built and checked the same way and nothing is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Re-sign every Monday so the index never outlives its maxAge between pushes; Folio refuses a stale source.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: folio-source
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build without signing, and check what it built
        run: python3 tools/build.py --no-sign

  # A copy of the template has no key until its owner adds one. Until then, build and check the source unsigned and
  # skip publishing, rather than failing every push. Secrets can't be read in a job's `if`, so this job looks for it.
  key:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.look.outputs.present }}
    steps:
      - id: look
        env:
          FOLIO_SOURCE_KEY: ${{ secrets.FOLIO_SOURCE_KEY }}
        run: |
          if [ -n "$FOLIO_SOURCE_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.look.outputs.present != 'true'
        uses: actions/checkout@v4
      - name: No key yet, so build without signing and check what it built
        if: steps.look.outputs.present != 'true'
        run: |
          python3 tools/build.py --no-sign
          echo "::notice::Not published: add the FOLIO_SOURCE_KEY secret to publish this source (see README, step 3)."

  publish:
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign
        env:
          # The private key lives only here, as a repository secret. Nothing else in this repository is a secret.
          FOLIO_SOURCE_KEY: ${{ secrets.FOLIO_SOURCE_KEY }}
          # A fixed timestamp for the whole run, so a rebuild of unchanged packages is byte for byte the same.
          SOURCE_DATE_EPOCH: ${{ github.event_name == 'push' && github.event.repository.pushed_at || '' }}
        run: python3 tools/build.py

      - name: Refuse to publish an unsigned source
        run: |
          test -f _site/entry.json.sig || { echo "No signature: set the FOLIO_SOURCE_KEY secret."; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
